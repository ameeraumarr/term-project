name: Deploy Production

on:
  push:
    branches:
      - production

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run HTML Linter
        run: npx htmlhint "src/**/*.html"

      - name: Run CSS Linter
        run: npx stylelint "styles/**/*.css"

      - name: Build project
        run: npm run build

      - name: Deploy log
        run: echo "Deployment to production-env done!"

