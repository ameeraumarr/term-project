name: Development Deploy

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 16
      - run: npm install
      - run: npm run lint:html || true
      - run: npm run lint:css || true
      - run: npm run build
      - run: echo "Deployment to development-env done!"
